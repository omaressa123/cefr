services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-to-a-long-random-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cefr_practice_partner}
      MYSQL_USER: ${MYSQL_USER:-cefr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-to-a-long-random-database-password}
    volumes:
      - ./data/database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-cefr}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE:-cefr_practice_partner}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      STT_BASE_URL: http://stt:7860
      STT_MODEL: whisper-verbatim-merged
      # Containerized Ollama (see the `ollama` service below). Service name,
      # not localhost — same localhost-trap class of bug as STT_BASE_URL had.
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_FAST_MODEL: qwen3:4b
      LLM_HEAVY_MODEL: qwen3:4b
    depends_on:
      database:
        condition: service_healthy
      stt:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed:learning && npm start"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
      - ./backups:/backups
    networks:
      - private
      - public
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  stt:
    build:
      context: .
      dockerfile: stt/Dockerfile
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./whisper-verbatim-merged:/models/whisper-verbatim-merged:ro
    networks:
      - private
      - public
    healthcheck:
      # /health returns 200 even while still loading, so gate on loaded:true.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json; d=json.load(urllib.request.urlopen('http://localhost:7860/health')); raise SystemExit(0 if d.get('loaded') else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Bind all interfaces so sibling containers can reach the API.
      OLLAMA_HOST: 0.0.0.0
    volumes:
      # Bind mount, matching the project's existing pattern
      # (./data/database, ./data, ./uploads, ./backups). Persists pulled
      # models across restarts so `ollama pull` is a first-boot-only cost.
      - ./data/ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    networks:
      # private is internal:true (no registry egress for `ollama pull`), so
      # ollama also joins public for egress — same dual-network setup as stt.
      - private
      - public
    healthcheck:
      # Gate on the required model actually being present, not just the
      # daemon responding — `ollama show` exits non-zero until the pull
      # in entrypoint.sh finishes.
      test: ["CMD-SHELL", "ollama show qwen3:4b >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 600s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public

networks:
  private:
    internal: true
  public:
